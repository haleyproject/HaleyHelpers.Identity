# Include inside the existing HTTPS server block.
# Nginx runs on the same server as Haley Identity's published loopback port.
# Keep the caller's generated application credentials in its backend configuration.

location = /hi-api {
    return 308 /hi-api/$is_args$args;
}

location ^~ /hi-api/ {
    # /hi-api/accounts/... becomes /api/identity/accounts/... on Haley.
    proxy_pass http://127.0.0.1:7430/api/identity/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
}

location = /hi-admin {
    return 308 /hi-admin/$is_args$args;
}

location ^~ /hi-admin/ {
    proxy_pass http://127.0.0.1:7430/admin/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cookie_path / /hi-admin/;
    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
}

# The shared recipient page is outside /admin/ on Haley Identity Host.
location ^~ /hi-admin/identity/verify/ {
    proxy_pass http://127.0.0.1:7430/identity/verify/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 20m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
    proxy_intercept_errors off;
}
